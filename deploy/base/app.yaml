apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calc
  template:
    metadata:
      labels:
        app: calc
    spec:
      containers:
        - name: calc
          image: ghcr.io/mierule7/action-practice
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: calc-env
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: calc
spec:
  type: NodePort
  selector:
    app: calc
  ports:
    - port: 80
      targetPort: 8000