apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../base
images:
  - name: ghcr.io/mierule7/action-practice
    newTag: "42"
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: calc-env
    literals:
      - APP_ENV=dev
patches:
  - target:
      kind: Service
      name: calc
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30181