apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calc-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mierule7/action-practice.git
    targetRevision: main
    path: deploy/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    syncOptions:
      - CreateNamespace=true