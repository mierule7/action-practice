name: Deploy Local (OpenTofu)

run-name: Tofu ${{ inputs.action }} ${{ inputs.environment }} - Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'apply starts or updates, destroy removes'
        type: choice
        required: true
        options:
          - apply
          - destroy
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - dev
          - uat
          - prod
      build_id:
        description: 'Build ID (already deployed by Manual Deploy)'
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TF_VAR_docker_host: npipe:////.//pipe//docker_engine

jobs:
  tofu-local:
    name: Tofu ${{ inputs.action }} ${{ inputs.environment }} build ${{ inputs.build_id }}
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: local-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Check Manual Deploy already passed for this build
        if: inputs.action == 'apply'
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ inputs.build_id }}
        run: |
          $ErrorActionPreference = 'Continue'
          $marker = "${{ env.IMAGE }}:$($env:ID)-$($env:TARGET)"
          docker manifest inspect $marker *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "OK: build $($env:ID) was already deployed to $($env:TARGET) by Manual Deploy"
          } else {
            Write-Host "BLOCKED: run Manual Deploy for $($env:TARGET) with build $($env:ID) first"
            exit 1
          }

      - name: OpenTofu init, plan and apply
        if: inputs.action == 'apply'
        working-directory: tofu
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ inputs.build_id }}
          TF_VAR_logtide_api_key: ${{ secrets.LOGTIDE_API_KEY }}
          TF_VAR_logtide_api_url: ${{ vars.LOGTIDE_API_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Recurse -Force .terraform -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path C:/tofu-state | Out-Null
          $state = "C:/tofu-state/$($env:TARGET).tfstate"
          $repo = "${{ env.IMAGE }}"
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            tofu init -input=false
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "tofu init failed (attempt $i of 3). Waiting 15 seconds."
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { exit 1 }
          tofu plan -input=false "-state=$state" "-var=environment=$($env:TARGET)" "-var=build_id=$($env:ID)" "-var=image_repo=$repo"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tofu apply -auto-approve -input=false "-state=$state" "-var=environment=$($env:TARGET)" "-var=build_id=$($env:ID)" "-var=image_repo=$repo"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $port = tofu output -raw "-state=$state" host_port
          $healthy = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              Invoke-RestMethod -Uri "http://localhost:$port/health" -TimeoutSec 3 | Out-Null
              $healthy = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $healthy) {
            Write-Host "Health check failed"
            exit 1
          }
          Write-Host "Open http://localhost:$port"

      - name: OpenTofu destroy
        if: inputs.action == 'destroy'
        working-directory: tofu
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ inputs.build_id }}
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Recurse -Force .terraform -ErrorAction SilentlyContinue
          $state = "C:/tofu-state/$($env:TARGET).tfstate"
          $repo = "${{ env.IMAGE }}"
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            tofu init -input=false
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "tofu init failed (attempt $i of 3). Waiting 15 seconds."
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { exit 1 }
          tofu destroy -auto-approve -input=false "-state=$state" "-var=environment=$($env:TARGET)" "-var=build_id=$($env:ID)" "-var=image_repo=$repo"
          if ($LASTEXITCODE -ne 0) { exit 1 }