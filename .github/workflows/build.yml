name: Build Image

run-name: Build ID ${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff bandit pytest pytest-cov

      - name: Lint (code smells, style)
        run: ruff check .

      - name: Security scan
        run: bandit -r . --exclude ./test_calc.py

      - name: Tests with coverage gate
        run: pytest -v --cov=calc --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}

      - name: Show build ID
        run: echo "Image built with BUILD ID ${{ github.run_number }}"