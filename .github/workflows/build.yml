name: Build Image

run-name: Build ID ${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:latest
  TRIVY_EXIT_CODE: '1'

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tools
        run: pip install ruff bandit pytest pytest-cov
      - name: Lint (code smells, style)
        run: ruff check .
      - name: Security scan
        run: bandit -r . --exclude ./test_calc.py
      - name: Tests with coverage gate
        run: pytest -v --cov=calc --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build, scan and push image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          build-args: BUILD_ID=${{ github.run_number }}
          tags: scan-target:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work ${{ env.TRIVY_IMAGE }} image --severity CRITICAL,HIGH --ignore-unfixed --exit-code ${{ env.TRIVY_EXIT_CODE }} scan-target:${{ github.run_number }}

      - name: Push the scanned image
        run: |
          docker tag scan-target:${{ github.run_number }} ghcr.io/${{ github.repository }}:${{ github.run_number }}
          docker tag scan-target:${{ github.run_number }} ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.run_number }}
          docker push ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Show build ID
        run: echo "Image built with BUILD ID ${{ github.run_number }} from commit ${{ github.sha }}"