name: Deploy Local

run-name: Local ${{ inputs.environment }} - Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - dev
          - uat
          - prod
      build_id:
        description: 'Build ID to start on my PC (already deployed by Manual Deploy)'
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy-local:
    name: Start build ${{ inputs.build_id }} as ${{ inputs.environment }} on my PC
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: local-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check Manual Deploy already passed for this build
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ inputs.build_id }}
        run: |
          $ErrorActionPreference = 'Continue'
          $marker = "${{ env.IMAGE }}:$($env:ID)-$($env:TARGET)"
          docker manifest inspect $marker *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "OK: build $($env:ID) was already deployed to $($env:TARGET) by Manual Deploy"
          } else {
            Write-Host "BLOCKED: run Manual Deploy for $($env:TARGET) with build $($env:ID) first"
            exit 1
          }

      - name: Start the app and the worker
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ inputs.build_id }}
          LOGTIDE_API_KEY: ${{ secrets.LOGTIDE_API_KEY }}
          LOGTIDE_API_URL: ${{ vars.LOGTIDE_API_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ports = @{ dev = 8081; uat = 8082; prod = 8083 }
          $port = $ports[$env:TARGET]
          $img = "${{ env.IMAGE }}:$($env:ID)"
          $app = "calc-$($env:TARGET)"
          $worker = "calc-worker-$($env:TARGET)"
          docker pull $img
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker network create calc-net *> $null
          docker rm -f $app $worker *> $null
          docker run -d --name $app --network calc-net --restart unless-stopped -p "${port}:8000" -e "APP_ENV=$($env:TARGET)" -e "KAFKA_BOOTSTRAP=kafka:9093" -e LOGTIDE_API_KEY -e LOGTIDE_API_URL $img
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker run -d --name $worker --network calc-net --restart unless-stopped -e "APP_ENV=$($env:TARGET)" -e "KAFKA_BOOTSTRAP=kafka:9093" $img python worker.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              Invoke-RestMethod -Uri "http://localhost:$port/health" -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Host "Health check failed. Container logs:"
            docker logs $app
            exit 1
          }
          Write-Host "Open http://localhost:$port"