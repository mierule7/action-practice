name: Manual Deploy

run-name: ${{ inputs.environment == 'dev' && 'Dev Environment' || inputs.environment == 'uat' && 'UAT Environment' || 'Prod Environment' }} - ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        required: true
        options:
          - dev
          - uat
          - prod
      version:
        description: "Branch, tag or commit SHA to deploy"
        required: true
        default: main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest -v

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Deploy
        run: |
          echo "Deploying ${{ inputs.version }} to ${{ inputs.environment }}"
          echo "Commit: ${{ github.sha }}"