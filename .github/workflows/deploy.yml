name: Manual Deploy

run-name: ${{ inputs.environment }} - Build ${{ inputs.build_id || 'latest' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev
          - uat
          - prod
      build_id:
        description: "Build image ID (leave blank for the latest build)"
        type: string
        required: false
      calc_branchname:
        description: "Enter calc branch name"
        type: string
        default: main
      calc_commit_id:
        description: "Commit id for the calc branch (leave blank for latest)"
        type: string
        required: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Deploy build ${{ inputs.build_id || 'latest' }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve build ID
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ID: ${{ inputs.build_id }}
        run: |
          if [ -n "$INPUT_ID" ]; then
            ID="$INPUT_ID"
          else
            ID=$(gh run list --repo "${{ github.repository }}" --workflow build.yml --status success --limit 1 --json number --jq '.[0].number')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "No build found. Run the Build Image workflow first."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Using build ID: $ID"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the build exists
        run: docker pull ${{ env.IMAGE }}:${{ steps.build.outputs.id }}

      - name: Check promotion order
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ steps.build.outputs.id }}
        run: |
          REQUIRED=""
          if [ "$TARGET" = "uat" ]; then REQUIRED="dev"; fi
          if [ "$TARGET" = "prod" ]; then REQUIRED="uat"; fi
          if [ -n "$REQUIRED" ]; then
            if docker manifest inspect ${{ env.IMAGE }}:$ID-$REQUIRED > /dev/null 2>&1; then
              echo "OK: build $ID was already deployed to $REQUIRED"
            else
              echo "BLOCKED: build $ID has not been deployed to $REQUIRED yet"
              exit 1
            fi
          fi

      - name: Checkout calc code (branch or commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calc_commit_id != '' && inputs.calc_commit_id || inputs.calc_branchname }}
          path: calc-src

      - name: Deploy and smoke test
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ steps.build.outputs.id }}
        run: |
          echo "Deploying build $ID to $TARGET"
          docker run -d --name app -e APP_ENV=$TARGET -p 8000:8000 ${{ env.IMAGE }}:$ID
          sleep 5
          curl -f http://localhost:8000/health
          curl -f "http://localhost:8000/api/calc?a=2&b=3&op=add"
          docker rm -f app

      - name: Record this deployment
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ steps.build.outputs.id }}
        run: |
          docker tag ${{ env.IMAGE }}:$ID ${{ env.IMAGE }}:$ID-$TARGET
          docker push ${{ env.IMAGE }}:$ID-$TARGET

      - name: Deployment report
        env:
          TARGET: ${{ inputs.environment }}
          ID: ${{ steps.build.outputs.id }}
        run: |
          {
            echo "## Deployment report"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | $TARGET |"
            echo "| Build ID | $ID |"
            echo "| Image | ${{ env.IMAGE }}:$ID |"
            echo "| Marker tag | $ID-$TARGET |"
            echo "| Deployed by | ${{ github.actor }} |"
            echo "| Source ref | ${{ inputs.calc_commit_id || inputs.calc_branchname }} |"
            echo "| Time (UTC) | $(date -u +'%Y-%m-%d %H:%M') |"
          } >> "$GITHUB_STEP_SUMMARY"