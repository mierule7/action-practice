name: Manual Deploy

run-name: ${{ inputs.environment == 'dev' && 'Dev Environment' || inputs.environment == 'uat' && 'UAT Environment' || 'Prod Environment' }} - Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        required: true
        options:
          - dev
          - uat
          - prod
      build_id:
        description: "Build ID to deploy (e.g. 12)"
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Deploy build ${{ inputs.build_id }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the build exists
        run: docker pull ${{ env.IMAGE }}:${{ inputs.build_id }}

      - name: Check promotion order
        run: |
          ENV="${{ inputs.environment }}"
          ID="${{ inputs.build_id }}"
          if [ "$ENV" = "uat" ]; then REQUIRED="dev"; fi
          if [ "$ENV" = "prod" ]; then REQUIRED="uat"; fi
          if [ -n "$REQUIRED" ]; then
            if docker manifest inspect ${{ env.IMAGE }}:$ID-$REQUIRED > /dev/null 2>&1; then
              echo "OK: build $ID was already deployed to $REQUIRED"
            else
              echo "BLOCKED: build $ID has not been deployed to $REQUIRED yet"
              exit 1
            fi
          fi

      - name: Deploy
        run: |
          echo "Deploying build ${{ inputs.build_id }} to ${{ inputs.environment }}"
          docker run --rm ${{ env.IMAGE }}:${{ inputs.build_id }}

      - name: Record this deployment
        run: |
          docker tag ${{ env.IMAGE }}:${{ inputs.build_id }} ${{ env.IMAGE }}:${{ inputs.build_id }}-${{ inputs.environment }}
          docker push ${{ env.IMAGE }}:${{ inputs.build_id }}-${{ inputs.environment }}